<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Flow</title>
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=9">
</head>

<body>
    <div class="app-container">
        <header>
            <div class="header-content"><h1>File Flow</h1></div>
            <div class="header-controls">
                <button id="mode-display-btn" class="mode-badge" title="Current Mode">Mode: Add .md</button>
                <button id="view-toggle-btn" class="icon-btn" title="Toggle View"></button>
                <button id="stats-btn" class="icon-btn" title="Statistics"></button>
                <button id="settings-btn" class="icon-btn" title="Settings"></button>
            </div>
        </header>

        <main>
            <div id="drop-zone" class="drop-zone">
                <div class="drop-content">
                    <div id="upload-icon" class="upload-icon"></div>
                    <p>Drop folder here</p>
                </div>
            </div>

            <div id="file-list-container" class="file-list-container hidden">
                <div class="list-header">
                    <h2>Files</h2>
                    <div class="toolbar">
                        <input type="text" id="filter-input" class="search-input" placeholder="Filter: *.js, !test/*">
                        <button id="apply-btn" class="text-btn">Apply Action</button>
                        <button id="download-csv-btn" class="text-btn">Download CSV</button>
                        <button id="download-zip-btn" class="text-btn">Download ZIP</button>
                        <button id="clear-btn" class="icon-btn" title="Clear"></button>
                    </div>
                </div>
                <ul id="file-list" class="file-tree"></ul>
            </div>
        </main>

        <!-- Status Toast -->
        <div id="status-toast" class="status-toast hidden">
            <div class="spinner"></div>
            <span id="status-text">Processing...</span>
        </div>
    </div>

    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script src="lib/jszip.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
